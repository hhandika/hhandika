<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="816" height="196" viewBox="0 0 816 196" fill="none" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Activity Rhythm Dashboard</title>
  <desc id="descId">Shows contributions by weekday and recent activity by hour of day</desc>
<style>

    :root {
      --md-sys-color-surface: #1a1c1e;
      --md-sys-color-on-surface: #e2e2e6;
      --md-sys-color-surface-variant: #44474e;
      --md-sys-color-on-surface-variant: #c4c6d0;
      --md-sys-color-surface-container: #212545; /* Chetwode 950 */

      --md-sys-color-primary: #b0c6f1; /* Chetwode 300 */
      --md-sys-color-on-primary: #3e4795; /* Chetwode 800 */
      --md-sys-color-primary-container: #4a54b8; /* Chetwode 700 */
      --md-sys-color-on-primary-container: #e4edfb; /* Chetwode 100 */

      --md-sys-color-tertiary: #e5bf8c; /* Porsche 300 */
      --md-sys-color-on-tertiary: #82462a; /* Porsche 800 */
      --md-sys-color-tertiary-container: #a2572c; /* Porsche 700 */
      --md-sys-color-on-tertiary-container: #f8eedc; /* Porsche 100 */

      --md-sys-color-outline: #8e9099;
      --md-sys-color-outline-variant: #444746;

      --stats-color-additions: #3fb950;
      --stats-color-deletions: #f85149;
    }


    .m3-headline-small {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 32px;
      fill: var(--md-sys-color-on-surface);
    }
    .m3-title-medium {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
      letter-spacing: 0.15px;
      fill: var(--md-sys-color-on-surface);
    }
    .m3-title-small {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.1px;
      fill: var(--md-sys-color-on-surface);
    }
    .m3-body-large {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: 0.5px;
      fill: var(--md-sys-color-on-surface-variant);
    }
    .m3-body-medium {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      letter-spacing: 0.25px;
      fill: var(--md-sys-color-on-surface-variant);
    }
    .m3-body-small {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      letter-spacing: 0.4px;
      fill: var(--md-sys-color-on-surface-variant);
    }
    .m3-label-large {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.1px;
      fill: var(--md-sys-color-primary);
    }
    .m3-streak-highlight {
      fill: var(--md-sys-color-tertiary);
    }
    .m3-label-medium {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      letter-spacing: 0.5px;
      fill: var(--md-sys-color-on-surface-variant);
    }
    .m3-display-small {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 36px;
      font-weight: 400;
      line-height: 44px;
      fill: var(--md-sys-color-on-surface);
    }
    

    .m3-container-large {
      rx: 12px;
      fill: var(--md-sys-color-surface);
      stroke: var(--md-sys-color-outline-variant);
      stroke-width: 1px;
    }
    .m3-card-medium {
      rx: 8px;
      fill: var(--md-sys-color-surface-container);
      stroke: var(--md-sys-color-outline-variant);
      stroke-width: 0.5px;
    }
    .m3-bar-chart {
      rx: 2px;
    }
    .m3-divider {
      stroke: var(--md-sys-color-outline-variant);
      stroke-width: 1px;
      opacity: 0.5;
    }
    
</style>
