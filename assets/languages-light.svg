<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240" fill="none" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Top Languages Dashboard</title>
  <desc id="descId">Shows a bar chart of top programming languages used</desc>
<style>

    :root {
      --md-sys-color-surface: #fcfcfc;
      --md-sys-color-on-surface: #1a1c1e;
      --md-sys-color-surface-variant: #e1e2e8;
      --md-sys-color-on-surface-variant: #44474e;
      --md-sys-color-surface-container: #f0f5fd; /* Chetwode 50 */

      --md-sys-color-primary: #5a67d1; /* Chetwode 600 */
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #e4edfb; /* Chetwode 100 */
      --md-sys-color-on-primary-container: #384077; /* Chetwode 900 */

      --md-sys-color-tertiary: #c46f32; /* Porsche 600 */
      --md-sys-color-on-tertiary: #ffffff;
      --md-sys-color-tertiary-container: #f8eedc; /* Porsche 100 */
      --md-sys-color-on-tertiary-container: #6a3b24; /* Porsche 900 */

      --md-sys-color-outline: #74777f;
      --md-sys-color-outline-variant: #c4c7c5;

      --stats-color-additions: #1a7f37;
      --stats-color-deletions: #cf222e;
    }


    .m3-headline-small {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 32px;
      fill: var(--md-sys-color-on-surface);
    }
    .m3-title-medium {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
      letter-spacing: 0.15px;
      fill: var(--md-sys-color-on-surface);
    }
    .m3-title-small {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.1px;
      fill: var(--md-sys-color-on-surface);
    }
    .m3-body-large {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
      letter-spacing: 0.5px;
      fill: var(--md-sys-color-on-surface-variant);
    }
    .m3-body-medium {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 20px;
      letter-spacing: 0.25px;
      fill: var(--md-sys-color-on-surface-variant);
    }
    .m3-body-small {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 400;
      line-height: 16px;
      letter-spacing: 0.4px;
      fill: var(--md-sys-color-on-surface-variant);
    }
    .m3-label-large {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.1px;
      fill: var(--md-sys-color-primary);
    }
    .m3-streak-highlight {
      fill: var(--md-sys-color-tertiary);
    }
    .m3-label-medium {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 16px;
      letter-spacing: 0.5px;
      fill: var(--md-sys-color-on-surface-variant);
    }
    .m3-display-small {
      font-family: 'Roboto', 'Google Sans', system-ui, sans-serif;
      font-size: 36px;
      font-weight: 400;
      line-height: 44px;
      fill: var(--md-sys-color-on-surface);
    }
    

    .m3-container-large {
      rx: 12px;
      fill: var(--md-sys-color-surface);
      stroke: var(--md-sys-color-outline-variant);
      stroke-width: 1px;
    }
    .m3-card-medium {
      rx: 8px;
      fill: var(--md-sys-color-surface-container);
      stroke: var(--md-sys-color-outline-variant);
      stroke-width: 0.5px;
    }
    .m3-bar-chart {
      rx: 2px;
    }
    .m3-divider {
      stroke: var(--md-sys-color-outline-variant);
      stroke-width: 1px;
      opacity: 0.5;
    }
    
</style>
<rect class="m3-container-large" x="0.5" y="0.5" width="399" height="239" />
  <text x="24" y="36" class="m3-headline-small">Top Languages</text>
  <text x="24" y="56" class="m3-body-small">Based on repository size</text>
  <clipPath id="lang-bar-clip">
    <rect x="24" y="84" width="352.0" height="12" rx="3" />
  </clipPath>
  <g clip-path="url(#lang-bar-clip)">
    <rect x="24" y="84" width="352.0" height="12" fill="var(--md-sys-color-surface-variant)" />
      <rect x="24.00" y="84" width="193.21" height="12" fill="#dea584" />
      <rect x="219.21" y="84" width="54.83" height="12" fill="#00B4AB" />
      <rect x="276.04" y="84" width="28.00" height="12" fill="#ff5a03" />
      <rect x="306.04" y="84" width="24.05" height="12" fill="#3572A5" />
      <rect x="332.09" y="84" width="13.92" height="12" fill="#3178c6" />
      <rect x="348.01" y="84" width="7.65" height="12" fill="#89e051" />
      <rect x="357.66" y="84" width="18.34" height="12" fill="#8e918f" />
  </g>
  <g transform="translate(24, 116)">
    <circle cx="6" cy="6" r="5.5" fill="#dea584" stroke="var(--md-sys-color-outline)" stroke-width="1" />
    <text x="20" y="11" class="m3-body-medium">Rust</text>
    <text x="164" y="11" text-anchor="end" class="m3-label-medium">55.5%</text>
  </g>
  <g transform="translate(212, 116)">
    <circle cx="6" cy="6" r="5.5" fill="#00B4AB" />
    <text x="20" y="11" class="m3-body-medium">Dart</text>
    <text x="164" y="11" text-anchor="end" class="m3-label-medium">16.1%</text>
  </g>
  <g transform="translate(24, 144)">
    <circle cx="6" cy="6" r="5.5" fill="#ff5a03" />
    <text x="20" y="11" class="m3-body-medium">Astro</text>
    <text x="164" y="11" text-anchor="end" class="m3-label-medium">8.5%</text>
  </g>
  <g transform="translate(212, 144)">
    <circle cx="6" cy="6" r="5.5" fill="#3572A5" />
    <text x="20" y="11" class="m3-body-medium">Python</text>
    <text x="164" y="11" text-anchor="end" class="m3-label-medium">7.4%</text>
  </g>
  <g transform="translate(24, 172)">
    <circle cx="6" cy="6" r="5.5" fill="#3178c6" />
    <text x="20" y="11" class="m3-body-medium">TypeScript</text>
    <text x="164" y="11" text-anchor="end" class="m3-label-medium">4.5%</text>
  </g>
  <g transform="translate(212, 172)">
    <circle cx="6" cy="6" r="5.5" fill="#89e051" stroke="var(--md-sys-color-outline)" stroke-width="1" />
    <text x="20" y="11" class="m3-body-medium">Shell</text>
    <text x="164" y="11" text-anchor="end" class="m3-label-medium">2.7%</text>
  </g>
  <g transform="translate(24, 200)">
    <circle cx="6" cy="6" r="5.5" fill="#8e918f" />
    <text x="20" y="11" class="m3-body-medium">Other</text>
    <text x="164" y="11" text-anchor="end" class="m3-label-medium">5.2%</text>
  </g>
</svg>
